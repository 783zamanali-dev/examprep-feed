# Builds the feed and publishes it with GitHub Pages.
# Runs when anything is pushed (n8n pushes the day pack every morning), once an hour so the
# 24-hour news page empties on time, and by hand from the Actions tab.
name: Publish feed

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Turn new day packs into feed files
        run: python ingest.py

      - name: Save what ingest wrote
        run: |
          git config user.name "examprep-feed"
          git config user.email "examprep-feed@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ingest day pack and tidy the feed"
          git push

      - name: Build the feed
        run: python build_feed.py --news-hours 24 --keep-days 62

      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed-out

      - id: deploy
        uses: actions/deploy-pages@v4
